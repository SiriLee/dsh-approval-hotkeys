# Publish dsh-approval-hotkeys to npm via GitHub Actions Trusted Publishing
# (OIDC — no long-lived NPM_TOKEN is stored or required).
#
# Prerequisite (one-time, on npmjs.com): the package must be published once
# (see docs/release.md), then in the package's "settings" page on npmjs.com
# add a trusted publisher:
#   Provider:   GitHub Actions
#   Org/User:   SiriLee
#   Repository: dsh-approval-hotkeys
#   Workflow:   publish.yml  (filename only, must match .github/workflows/)
#   Environment: (leave blank)
#   Allowed actions: npm publish
#
# Trigger: push a `v<semver>` tag matching package.json version (recommended)
# or run the workflow manually. Release flow:
#   npm version patch && git push origin main --tags

name: publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dist_tag:
        description: >-
          npm dist-tag to publish under (empty = derive from the version:
          a prerelease uses its identifier, e.g. rc; a stable version uses
          latest). Use "next" for a build that only supports a DSH line whose
          own dist-tag is next, so users on the promoted line are not moved
          onto it by an update.
        required: false
        default: ''
        type: string

permissions:
  contents: write # create the GitHub Release
  # Required for npm trusted publishing: npm exchanges this OIDC token for a
  # short-lived registry credential and attaches Sigstore provenance.
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # npm trusted publishing requires npm CLI >= 11.5.1 and Node >= 22.14
          # (docs.npmjs.com/trusted-publishers); Node 24 ships npm 11.x.
          node-version: 24

      - name: Verify npm >= 11.5.1 (trusted publishing requirement)
        run: |
          set -euo pipefail
          ver=$(npm --version)
          echo "npm: $ver"
          if [ "$(printf '%s\n' '11.5.1' "$ver" | sort -V | head -1)" != '11.5.1' ]; then
            echo "::error::npm $ver < 11.5.1 — OIDC publish needs >= 11.5.1"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck & test
        run: npm run typecheck && npm test

      - name: Build (full, with .d.ts) and verify built artifact
        run: npm run build && node scripts/verify-host.mjs

      - name: Verify tag matches package version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            PKG_VERSION="$(node -p "require('./package.json').version")"
            if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
              echo "::error::tag ${GITHUB_REF_NAME} does not match package.json version ${PKG_VERSION}" >&2
              exit 1
            fi
            echo "publishing ${PKG_VERSION} from tag ${GITHUB_REF_NAME}"
          else
            echo "manual dispatch: publishing $(node -p "require('./package.json').version")"
          fi

      # Idempotency guard: makes workflow_dispatch re-runs (and tag pushes of
      # an already-published version) safe instead of failing on EPUBLISHCONFLICT.
      - name: Skip publish if version already on npm
        id: check
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "${NAME}@${VERSION}" version >/dev/null 2>&1; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${NAME}@${VERSION} already on npm — skipping publish step."
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi

      # Trusted publishing: npm reads the CI OIDC token automatically
      # (ACTIONS_ID_TOKEN_REQUEST_URL). No NODE_AUTH_TOKEN secret needed.
      #
      # dist-tag: an explicit dispatch input wins; otherwise it is derived from
      # the version (a prerelease publishes under its identifier, e.g. `rc`, a
      # stable version under `latest`). Publishing a build that targets a DSH
      # line still sitting on npm's `next` tag must use `next` as well: npm
      # `latest` users are otherwise moved by an update onto a plugin build
      # whose peer range the startup admission gate refuses, which skips the
      # whole bundle.
      - name: Resolve the npm dist-tag
        id: tag
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG='${{ inputs.dist_tag }}'
          if [ -z "$TAG" ]; then
            case "$VERSION" in
              *-*) TAG="${VERSION#*-}"; TAG="${TAG%%.*}" ;;
              *) TAG=latest ;;
            esac
          fi
          echo "dist_tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "publishing ${VERSION} under dist-tag ${TAG}"

      - name: Publish to npm via OIDC
        if: steps.check.outputs.already_published == 'false'
        run: npm publish --provenance --access public --tag "${{ steps.tag.outputs.dist_tag }}"

      - name: Create GitHub Release (if missing)
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          DIST_TAG: ${{ steps.tag.outputs.dist_tag }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists — leaving it alone."
            exit 0
          fi
          # Only a `latest` publish is the repository's latest release; a
          # `next`/prerelease publish must not claim that marker.
          LATEST_FLAG=()
          if [ "$DIST_TAG" = "latest" ]; then LATEST_FLAG=(--latest); fi
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${{ github.repository }}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            "${LATEST_FLAG[@]}"
